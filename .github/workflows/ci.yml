name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the oldest Node that package.json allows. 18 and 20 have no
        # node:sqlite, so they exercise the in-memory fallback; 22 and 24 run
        # the full suite, SQLite included.
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      # No install step: the package has no dependencies.
      - run: npm test
      # The numbers the documentation states, against the repository itself.
      - run: npm run numbers
