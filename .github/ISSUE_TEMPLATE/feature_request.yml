name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        jev-bridge takes **no runtime dependencies** and keeps **policy out of the bridge** —
        thresholds and decisions belong to the caller. Ideas that fit those two rules are the easiest to land.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
